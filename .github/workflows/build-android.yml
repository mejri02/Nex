name: Build Vyra TV Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android --org com.vyra.tv .
      - name: Patch Android manifest (internet, http streams, Android TV)
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          extra = ''
          if 'android.permission.INTERNET' not in s:
              extra += '    <uses-permission android:name="android.permission.INTERNET"/>\n'
          extra += '    <uses-feature android:name="android.software.leanback" android:required="false"/>\n'
          extra += '    <uses-feature android:name="android.hardware.touchscreen" android:required="false"/>\n'
          s = s.replace('<application', extra + '    <application', 1)
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="Vyra TV"', s, count=1)
          launcher = '<category android:name="android.intent.category.LAUNCHER"/>'
          if launcher in s and 'LEANBACK_LAUNCHER' not in s:
              s = s.replace(launcher, launcher + '\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print(s)
          PY
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: vyra-tv-release-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
